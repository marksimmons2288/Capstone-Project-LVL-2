<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Shortly URL shortening API Challenge</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

   

              <!-- CSS Styles -->
<link rel="stylesheet" href="styles/desktop.styles.css">
               <!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
 

<header>
                  <!-- Nav-Bar-->
  <nav class="nav-bar" aria-label="Main navigation">
    <img src="images/logo.svg"          class="nav-bar_title" alt="Shortly logo">
     
    <ul class="nav-bar_links" 
    role="navigation" aria-label="Navagation Links">
      <li><a href="#" id="featuresLink">Features</a></li>
      <li><a href="#" id="pricingLink" >Pricing</a></li>
      <li><a href="#" id="resourcesLink" >Resources</a></li>
    </ul>
            <!-- Authorization links -->
    <ul class="auth-links">
     <li><a href="#" id="loginBtn">Login</a></li>
     <li><a href="#" id="signUpBtn">Sign Up</a></li>
    </ul>
  </nav>
</header>
 
         <!-- Main content -->
<main>
   <section class="main-form_container">
          <!-- Title -->
    <div class="main-form_text">
      <h1>More than just <br> shorter links</h1>
          <!-- Subtitle -->
           <div>
   <pre class="main-form_subtitle">Build your brand’s recognition and get detailed 
insights on how your links are performing.
  </pre>
           </div>
     
    <a href="#" id="getStarted">Get Started</a>
  </div>
       
  <figure class="main-form_img"
    aria-hidden="true">
    <div class="desk-img">
      <img src="images/illustration-working.svg" alt="Illustration of a person working at a computer desk">
    </div>
  </figure>
</section>
            <!-- Input URL Section -->
  <section class="url-shortener_container">
    <div class="url-bg">
    
      <img src="images/bg-shorten-desktop.svg" alt="Illustration around input field" 
      aria-hidden="true" 
      class="url-bg_img">
      
            
              <!--Form  -->
  <form class="url-form" id="mainForm">
   <div class="input-message">
    <input type="url" 
    name="url" 
    class="url-form_input" id="urlInput"
    placeholder="Shorten a link here..." 
    pattern="https?://.+"
    title="Enter a valid URL, e.g. https://www.example.com"
    aria-required="true">
            <!--Div to display messages  -->
  <div id="result-message"role="status"></div>
</div>
            <!-- Submit btn -->
<button type="submit"
     class="url-form_submit"        
     id="shortenBtn" 
     name="button">Shorten It!
    </button>
   </form>
  </section>
  <!-- Render Inputs -->
<div class="render-container" id="renderURL">
</div>
</main>


           <!-- Footer -->
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

            <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
          <!-- JavaScript -->
   <script src="script/main.js"></script>
</body>
</html>
