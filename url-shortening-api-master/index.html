<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Shortly URL shortening API Challenge</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

  <!-- CSS Styles -->
   <link rel="stylesheet" href="styles/desktop.styles.css">
</head>
<body>
 

<header>
<!-- Flex row this across the top of page -->
  <nav class="nav-bar" aria-label="Main navigation">
    <img src="images/logo.svg"          class="nav-bar_title" alt="Shortly logo">
    <!-- Links with Aria -->
     <div role="navigation" aria-label="Navagation Links" class="nav-bar_links">
      <a href="#" class="features_link">Features</a>
      <a href="#" class="pricing_link">Pricing</a>
      <a href="#" class="resources_link">Resources</a>
     </div>

     <!-- Authorization links w/ hover btn styles -->
      <div class="auth-links">
      <a href="#" class="login_btn">Login</a>
      <a href="#" class="sign_up_btn">Sign Up</a>
    </div>
  </nav>
</header>
 
<!-- Main content -->
<main>
   <section class="main-form_container">
          <!-- Title -->
    <h1>More than just shorter links</h1>
  <!-- Subtitle -->
    <p class="main-form_subtitle">
     Build your brand’s recognition and get detailed <br> insights 
     on how your links are performing.
   </p>
      
  <!-- Information button (labeled "Get Started") -->
    <button type="button" class="start_btn">Get Started</button>
   
   <!-- Main content illustration w/ hidden image from aria -->
  <div class="main-form_img" aria-hidden="true">
         <img src="images/illustration-working.svg" alt="Illustration of a person working at a computer desk">
    </div>
   </section>

<!-- Input URL Section -->
  <section class="url-shortener_container">
    <form class="main-form" id="mainForm">
    <label for="urlInput" class="sr-only">Enter URL</label>
    
    <div class="url-shortener_input_field">
      <input type="url" name="url" id="urlInput" placeholder="Shorten a link here..." aria-required="true" required>


      <img src="images/bg-shorten-desktop.svg" alt="Illustration around input field">

      <!-- Submit button -->
      
      <button type="submit"class="shorten_it_btn" name="button">Shorten It!</button>
    
    <!-- Render Shorten URL w/ Aria role status to announce dynamic updates  -->
     <div id="result"role="status"></div>
    
    </form>
  </section>
</main>

     <!-- Footer -->
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>

  <!-- JavaScript -->
   <script src="script/main.js"></script>
</body>
</html>
